# GRU-aggregate for OpenTouch — DETERMINISTIC point forecaster on the aggregate F/CoP signal.
# Rate / horizon / target / min_history / stride / split all come from the FROZEN harness
# (configs/opentouch/eval_harness.yaml); this file only controls the model + optimization.
# Read by src/opentouch/gru_aggregate.py. See SESSION_LOG 2026-08-12 (Q6) for why this path is
# forked out of src/actionsense/tactile_map/ while CNN-map / flatten-map stay deferred.

model:
  d: 64                 # per-frame embedding dim   } kept at the ActionSense values so the
  hidden: 64            # GRU hidden size           } cross-sensor comparison varies the sensor,
                        #                             not the capacity

optim:
  epochs: 60
  lr: 0.003
  batch: 64
  seed: 0               # frozen; training determinism is enforced in gru_aggregate.configure_determinism

sweep:
  # OQ-H (2026-08-11): history sweep is {1,2,3} s. 0.5 s is NOT a sweep point — it is only the
  # frozen harness's min_history floor. At 30 Hz native these are {30,60,90} input frames.
  # (ActionSense swept {1,3,10} s at 10 Hz; 5 s/10 s are impossible here — a 10 s history leaves
  #  90 of 2,958 clips, measured 2026-08-07.)
  histories_s: [1, 2, 3]

paths:
  out_dir: runs/opentouch_gru_aggregate
